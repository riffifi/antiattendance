name: Android verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=2
      - name: Verify shared controls
        working-directory: third_party/brockmann
        run: |
          flutter pub get
          flutter test --concurrency=2
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify Android logic
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
